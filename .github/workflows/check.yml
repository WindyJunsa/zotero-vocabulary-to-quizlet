name: Check and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test test.cjs vocabulary.test.cjs i18n.test.cjs
      - run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: vocabulary-to-quizlet
          path: dist/*
